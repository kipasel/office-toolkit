[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "office-toolkit"
version = "0.1.0"
description = "Desktop Windows offline toolkit for PDF, images, QR, and file utilities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Office Toolkit" }]
license = { file = "LICENSE" }
keywords = ["pdf", "image", "qrcode", "desktop", "pyside6", "offline"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Environment :: Win32 (MS Windows)",
  "Topic :: Office/Business",
  "Topic :: Multimedia",
  "Topic :: Utilities",
  "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
  "PySide6==6.11.2",
  "pymupdf==1.28.2",
  "pypdf==6.20.0",
  "Pillow==11.3.0",
  "qrcode==8.2",
  "zxing-cpp==3.1.1",
  "pikepdf==9.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "PyInstaller==6.21.0",
]

[project.scripts]
office-toolkit = "office_toolkit.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
qt_api = "pyside6"
